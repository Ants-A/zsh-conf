"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = "$directory$os$git_branch$git_status$nodejs$rust$golang$php $character"

[os]
disabled = false
format = "[$symbol](#adc6ff) "

[os.symbols]
Ubuntu  = "󰕈"
Artix   = "󰣇"
Arch    = "󰣇"
CachyOS = "󰣇"
Macos   = ""

[directory]
format            = "[$path](#bfc6dc) "
truncation_length = 4
truncate_to_repo  = true

[git_branch]
symbol = ""
format = "[$symbol $branch](bold #ca9ee6) "

[git_status]
format     = "($ahead_behind$staged$modified$untracked$deleted$conflicted)"
ahead      = "[⇡$count ](bold #81c8be)"
behind     = "[⇣$count ](bold #81c8be)"
diverged   = "[⇡$ahead_count⇣$behind_count ](bold #81c8be)"
staged     = "[+$count ](bold #a6d189)"
modified   = "[●$count ](bold #e5c890)"
untracked  = "[?$count ](bold #e2e2e9)"
deleted    = "[✘$count ](bold #ffb4ab)"
conflicted = "[⚡$count ](bold #ffb4ab)"

[nodejs]
symbol = ""
format = "[$symbol $version](#adc6ff) "

[rust]
symbol = ""
format = "[$symbol $version](#ffb4ab) "

[golang]
symbol = ""
format = "[$symbol $version](#bfc6dc) "

[php]
symbol = ""
format = "[$symbol $version](#debcdf) "

[character]
success_symbol = "[❯](#adc6ff)"
error_symbol   = "[❯](#ffb4ab)"
vimcmd_symbol  = "[❮](#adc6ff)"
