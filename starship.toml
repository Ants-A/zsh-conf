"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = "$directory$os$git_branch$git_status$nodejs$rust$golang$php $character"

[os]
disabled = false
format = "[$symbol](#a0d49b) "

[os.symbols]
Ubuntu  = "󰕈"
Artix   = "󰣇"
Arch    = "󰣇"
CachyOS = "󰣇"
Macos   = ""

[directory]
format            = "[$path](#b9ccb4) "
truncation_length = 4
truncate_to_repo  = true

[git_branch]
symbol = ""
format = "[$symbol $branch](bold #ca9ee6) "

[git_status]
format     = "($ahead_behind$staged$modified$untracked$deleted$conflicted)"
ahead      = "[⇡$count ](bold #81c8be)"
behind     = "[⇣$count ](bold #81c8be)"
diverged   = "[⇡$ahead_count⇣$behind_count ](bold #81c8be)"
staged     = "[+$count ](bold #a6d189)"
modified   = "[●$count ](bold #e5c890)"
untracked  = "[?$count ](bold #e0e4db)"
deleted    = "[✘$count ](bold #ffb4ab)"
conflicted = "[⚡$count ](bold #ffb4ab)"

[nodejs]
symbol = ""
format = "[$symbol $version](#a0d49b) "

[rust]
symbol = ""
format = "[$symbol $version](#ffb4ab) "

[golang]
symbol = ""
format = "[$symbol $version](#b9ccb4) "

[php]
symbol = ""
format = "[$symbol $version](#a1ced4) "

[character]
success_symbol = "[❯](#a0d49b)"
error_symbol   = "[❯](#ffb4ab)"
vimcmd_symbol  = "[❮](#a0d49b)"
